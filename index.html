<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
<title>Claude</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<!-- This page holds no data and no keys. The key arrives once in the pairing link (#peer=...&key=...) and stays on the phone. -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  /* Claude's own look (13 Oct, Harsh: "Claude app style"): warm paper in light mode, warm charcoal in dark, one clay-orange
     orb that breathes while Claude thinks and swells with whoever is talking, and the words in a calm serif */
  :root { --bg: #faf9f5; --surface: #f0eee6; --surface2: #e8e6dc; --line: #dedcd1; --text: #141413; --dim: #6f6d66;
          --primary: #d97757; --onprimary: #ffffff; --tint: rgba(217,119,87,.14); --endbg: #c4422f; --ok: #d97757; --okfg: #fff;
          --warn: #c8941f; --good: #4f8f5d; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05); }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #262624; --surface: #30302e; --surface2: #3a3a37; --line: #474743; --text: #faf9f5; --dim: #a6a39a;
            --tint: rgba(217,119,87,.18); --endbg: #d0533f; --warn: #e2b553; --good: #7fbf8c; --shadow: none; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
               font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  button { font: inherit; color: inherit; }
  .hidden { display: none !important; }
  .serif { font-family: "Source Serif 4", "Noto Serif", Georgia, serif; }

  .bar { display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 6px; flex-shrink: 0; }
  .icon-btn { width: 44px; height: 44px; border: 0; background: none; border-radius: 12px; display: grid; place-items: center; cursor: pointer; color: var(--dim); }
  .icon-btn:active { background: var(--surface); }
  .icon-btn svg { width: 22px; height: 22px; }
  .bar .title { flex: 1; padding-left: 4px; font-family: "Source Serif 4", "Noto Serif", Georgia, serif; font-size: 20px; font-weight: 500; }
  #updateChip, #onCallChip { margin-right: 4px; border: 0; border-radius: 999px; padding: 6px 12px; font-size: 13px; }
  #updateChip { background: var(--tint); color: var(--primary); }
  #onCallChip { background: var(--primary); color: var(--onprimary); }

  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .scroll { overflow-y: auto; padding: 4px 16px 24px; }

  /* the call screen: the orb, a quiet status line, and what is being said */
  #callTop { padding: 6vh 24px 0; display: flex; flex-direction: column; align-items: center; }
  #avatar { width: 150px; height: 150px; border-radius: 50%; position: relative; font-size: 0;
            background: radial-gradient(circle at 34% 30%, #f6c4ad 0%, #e38b6b 38%, #d97757 60%, #b8593b 100%);
            box-shadow: 0 0 0 0 rgba(217,119,87,0), 0 18px 50px -12px rgba(217,119,87,.55);
            transform: scale(calc(var(--ring, 1) * var(--rest, 1))); transition: transform .14s ease-out, box-shadow .3s, filter .4s; }
  #avatar::before { content: ''; position: absolute; inset: -18px; border-radius: 50%;
                    background: radial-gradient(circle, rgba(217,119,87,.28), rgba(217,119,87,0) 70%); opacity: .5; transition: opacity .3s; }
  body:not(.oncall) #avatar { --rest: .82; filter: saturate(.85); }
  body:not(.oncall) #avatar::before { opacity: 0; }
  .talking #avatar::before { opacity: 1; }
  .thinking #avatar { animation: breathe 1.8s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(.94); filter: brightness(.95); } 50% { transform: scale(1.03); filter: brightness(1.05); } }
  #name { display: none; }
  #status { margin-top: 28px; color: var(--dim); font-size: 14px; min-height: 20px; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
  #wave { display: none; }
  #caption { flex: 1; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 8px 32px;
             text-align: center; font-family: "Source Serif 4", "Noto Serif", Georgia, serif; font-size: 23px; line-height: 1.38; }
  #caption.me { color: var(--dim); font-style: italic; }
  #hint { text-align: center; color: var(--dim); font-size: 13px; min-height: 18px; padding: 0 16px; }

  #compose { padding: 8px 16px 4px; }
  #chips { display: flex; gap: 8px; margin-bottom: 8px; justify-content: center; }
  .chip { display: flex; align-items: center; gap: 2px; height: 30px; padding: 0 4px 0 12px; border-radius: 999px; background: var(--surface);
          font-size: 13px; color: var(--dim); }
  .chip select { background: transparent; border: 0; color: var(--text); font: inherit; font-size: 13px; padding: 4px; outline: none; }
  .chip select option { background: var(--surface); }
  .field { display: flex; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 26px;
           padding: 4px 4px 4px 18px; box-shadow: var(--shadow); }
  .field input { flex: 1; min-width: 0; height: 44px; border: 0; background: none; color: var(--text); font: inherit; outline: none; }
  .field input::placeholder { color: var(--dim); }
  .field button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--primary); color: var(--onprimary);
                  display: grid; place-items: center; flex-shrink: 0; }

  /* one row of round controls at the bottom, End on the right, as in Claude's voice mode */
  #dock { display: flex; justify-content: center; align-items: center; gap: 14px; padding: 14px 16px 26px; }
  #keys { display: flex; gap: 14px; }
  .key { display: contents; }
  .key span { display: none; }
  .round { width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--surface); color: var(--text);
           display: grid; place-items: center; cursor: pointer; transition: background .15s, transform .1s; }
  .round svg { width: 24px; height: 24px; }
  .round.on { background: var(--text); color: var(--bg); }
  .round:active { transform: scale(.94); }
  #endRow { display: flex; }
  #end { background: var(--endbg); color: #fff; }
  #call { width: auto; height: 56px; padding: 0 28px 0 22px; border-radius: 999px; background: var(--primary); color: var(--onprimary);
          display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 500; box-shadow: 0 8px 24px -8px rgba(217,119,87,.7); }
  #call svg { width: 22px; height: 22px; }

  /* sidebar */
  #scrim { position: fixed; inset: 0; background: rgba(20,20,19,.4); z-index: 9; }
  #drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(84vw, 320px); background: var(--bg); z-index: 10;
            border-right: 1px solid var(--line); padding: calc(env(safe-area-inset-top) + 14px) 10px 16px; transform: translateX(-105%);
            transition: transform .22s ease; display: flex; flex-direction: column; }
  #drawer.open { transform: none; }
  #drawer h2 { font-family: "Source Serif 4", "Noto Serif", Georgia, serif; font-size: 22px; font-weight: 500; margin: 6px 14px 14px; }
  .nav { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 14px; border-radius: 10px; border: 0; background: none;
         width: 100%; text-align: left; font-size: 15px; cursor: pointer; margin-bottom: 2px; }
  .nav svg { width: 20px; height: 20px; color: var(--dim); }
  .nav:active { background: var(--surface); }
  .nav.active { background: var(--surface2); }
  .nav.active svg { color: var(--primary); }
  .nav .badge { margin-left: auto; font-size: 12px; color: var(--primary); }
  #drawer select { background: var(--surface) !important; border: 1px solid var(--line) !important; }

  .section { margin-top: 18px; }
  .section h3 { font-size: 12px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; margin: 0 4px 8px; }
  .card { background: var(--surface); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; font-size: 15px; }
  .card .sub { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .btns { display: flex; gap: 8px; margin-top: 10px; }
  .btns button { flex: 1; height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); }
  .btns button.yes { background: var(--primary); color: var(--onprimary); border: 0; }
  .empty { color: var(--dim); text-align: center; padding: 40px 0; }
  .refresh { color: var(--dim); font-size: 12px; text-align: center; margin-top: 12px; }

  #sheet { position: fixed; inset: 0; background: rgba(20,20,19,.4); display: flex; align-items: flex-end; z-index: 8; }
  #sheet .panel { width: 100%; max-height: 78dvh; background: var(--bg); border-radius: 24px 24px 0 0; display: flex; flex-direction: column;
                  padding: 8px 16px calc(16px + env(safe-area-inset-bottom)); }
  #sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 6px auto 14px; }
  #log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 0 4px; }
  .line { font-family: "Source Serif 4", "Noto Serif", Georgia, serif; font-size: 17px; line-height: 1.45; max-width: 92%; }
  .line.harsh { align-self: flex-end; background: var(--surface); border-radius: 18px; padding: 8px 14px; max-width: 82%;
                font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; }
  #pair { margin: auto; text-align: center; color: var(--dim); max-width: 320px; padding: 24px; }
</style>
</head>
<body>
<div class="bar">
  <button class="icon-btn" id="menu" aria-label="Open the sidebar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button>
  <span class="title" id="barTitle">Claude</span>
  <button id="onCallChip" class="hidden">On call 0:00</button>
  <button id="updateChip" class="hidden">Update ready</button>
  <button class="icon-btn" id="reload" aria-label="Reload the app"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg></button>
</div>

<section class="view" id="v-call">
  <div id="callTop">
    <div id="avatar" aria-hidden="true"></div>
    <div id="name">Claude</div>
    <div id="status">Ready to call</div>
    <div id="wave"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div id="caption">Tap Talk and just speak.</div>
  <div id="hint"></div>
  <div id="compose" class="hidden">
    <div id="chips">
      <label class="chip">To <select id="desk" aria-label="Which desk">
        <option value="auto">Auto</option><option value="daily">Daily</option><option value="mis">MIS</option><option value="analysis">Analysis</option>
        <option value="marketing">Marketing</option><option value="studio">Studio</option><option value="setup">Setup</option></select></label>
      <label class="chip">Mode <select id="mode" aria-label="How to handle it">
        <option value="normal">Do it</option><option value="plan">Plan first</option><option value="quick">Quick answer</option></select></label>
    </div>
    <form class="field" id="typeBar" autocomplete="off">
      <input id="typed" placeholder="Type, or use your keyboard's mic" enterkeyhint="send" aria-label="Type a message to Claude">
      <button type="submit" aria-label="Send"><svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M3 20V4l19 8z"/></svg></button>
    </form>
  </div>
  <div id="dock">
  <div id="keys" class="hidden">
    <div class="key"><button class="round" id="mute" aria-label="Mute"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg></button><span id="muteLabel">Mute</span></div>
    <div class="key"><button class="round" id="kb" aria-label="Keyboard"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 5H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm-9 3h2v2h-2zm0 3h2v2h-2zM8 8h2v2H8zm0 3h2v2H8zm-1 2H5v-2h2zm0-3H5V8h2zm9 7H8v-2h8zm0-4h-2v-2h2zm0-3h-2V8h2zm3 3h-2v-2h2zm0-3h-2V8h2z"/></svg></button><span>Keyboard</span></div>
    <div class="key"><button class="round" id="history" aria-label="Transcript"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM6 9h12v2H6zm8 5H6v-2h8zm4-6H6V6h12z"/></svg></button><span>Transcript</span></div>
  </div>
  <div id="endRow">
    <button class="round" id="call" aria-label="Call Claude"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg><span>Talk</span></button>
    <button class="round hidden" id="end" aria-label="End call"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1a1 1 0 0 1-.56.9 11.5 11.5 0 0 0-2.66 1.85 1 1 0 0 1-1.41-.02L.29 13.08a1 1 0 0 1 0-1.41C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67a1 1 0 0 1 0 1.41l-2.48 2.48a1 1 0 0 1-1.41.02 11.3 11.3 0 0 0-2.66-1.85 1 1 0 0 1-.56-.9v-3.1A15 15 0 0 0 12 9z"/></svg></button>
  </div>
  </div>
</section>

<section class="view hidden" id="v-panel"><div class="scroll" id="panelBody"></div></section>

<div id="scrim" class="hidden"></div>
<nav id="drawer" aria-label="Sidebar">
  <h2>Claude</h2>
  <button class="nav active" data-view="call"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>Call</button>
  <button class="nav" data-view="brain"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-1V1h-2v2H8V1H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 16H5V8h14zM7 10h5v5H7z"/></svg>Brain<span class="badge" id="b-brain"></span></button>
  <button class="nav" data-view="approvals"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5zm-2 16-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9z"/></svg>Approvals<span class="badge" id="b-approvals"></span></button>
  <button class="nav" data-view="desks"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg>Desks</button>
  <button class="nav" data-view="mis"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>MIS</button>
  <button class="nav" data-view="connectors"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.9 12a3.1 3.1 0 0 1 3.1-3.1h4V7H7a5 5 0 0 0 0 10h4v-1.9H7A3.1 3.1 0 0 1 3.9 12zM8 13h8v-2H8zm9-6h-4v1.9h4a3.1 3.1 0 0 1 0 6.2h-4V17h4a5 5 0 0 0 0-10z"/></svg>Connectors</button>
  <div style="margin-top:auto;padding:12px 16px;color:var(--dim);font-size:13px">
    <label>Speech recognition<br><select id="stt" style="margin-top:6px;width:100%;height:40px;border-radius:8px;background:var(--surface2);color:var(--text);border:0;padding:0 8px;font:inherit">
      <option value="google">Google, on the phone (best)</option><option value="laptop">On the laptop</option></select></label>
  </div>
</nav>

<div id="sheet" class="hidden"><div class="panel">
  <div class="grab"></div>
  <div id="log"><div class="empty">Nothing said yet.</div></div>
  <form class="field" id="sheetType" autocomplete="off" style="padding-top:12px">
    <input id="typed2" placeholder="Type to Claude" enterkeyhint="send" aria-label="Type a message to Claude">
    <button type="submit" aria-label="Send"><svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M3 20V4l19 8z"/></svg></button>
  </form>
</div></div>

<audio id="remote" autoplay playsinline></audio>
<audio id="clip" playsinline></audio>
<script>
'use strict';
const h = new URLSearchParams(location.hash.slice(1));
if (h.get('peer') && h.get('key')) {
  try { localStorage.setItem('callPeer', h.get('peer')); localStorage.setItem('callKey', h.get('key')); } catch (e) {}
  history.replaceState(null, '', location.pathname);
}
let PEER = '', KEY = '';
try { PEER = localStorage.getItem('callPeer') || h.get('peer') || ''; KEY = localStorage.getItem('callKey') || h.get('key') || ''; } catch (e) { PEER = h.get('peer') || ''; KEY = h.get('key') || ''; }
if (!PEER || !KEY) { document.body.innerHTML = '<div id="pair">Not paired yet. On the PC open the pairing page and scan its code with this phone.</div>'; throw 0; }
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

const $ = id => document.getElementById(id);
const statusEl = $('status'), hint = $('hint'), caption = $('caption'), log = $('log'), remote = $('remote');
let peer = null, conn = null, stream = null, actx = null, wake = null, claudeState = 'idle', inCall = false, muted = false;
let micLevel = null, remoteLevel = null, callStart = 0, currentView = 'call';

// ---------------------------------------------------------------- call screen
function fmt(s) { return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); }
function setState(s) {
  claudeState = s;
  const word = { idle: 'Listening', listening: 'Listening', thinking: 'Thinking', speaking: 'Speaking', connecting: 'Calling...', ready: 'Ready to call', dropped: 'Reconnecting...' }[s] || s;
  statusEl.textContent = inCall ? `${fmt((Date.now() - callStart) / 1000)}  ·  ${muted ? 'Muted' : word}` : word;
  document.body.classList.toggle('thinking', s === 'thinking');
}
setInterval(() => {
  if (inCall) { setState(claudeState); $('onCallChip').textContent = 'On call ' + fmt((Date.now() - callStart) / 1000); }
}, 1000);
function showCallControls(on) {
  for (const id of ['compose', 'keys', 'end']) $(id).classList.toggle('hidden', !on);
  document.body.classList.toggle('oncall', on);
  $('call').classList.toggle('hidden', on);
  $('onCallChip').classList.toggle('hidden', !on || currentView === 'call');
}
function line(who, text) {
  log.querySelector('.empty')?.remove();
  const d = document.createElement('div'); d.className = 'line ' + who; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  caption.textContent = text; caption.className = who === 'harsh' ? 'me' : '';
}

// the bars and the ring around the avatar follow whoever is talking
function levelOf(an) {
  if (!an) return 0;
  const a = new Float32Array(an.fftSize); an.getFloatTimeDomainData(a);
  let sum = 0; for (const x of a) sum += x * x;
  return Math.sqrt(sum / a.length);
}
let smooth = 0;
const bars = [...document.querySelectorAll('#wave i')], shape = [0.6, 0.85, 1, 0.85, 0.6];
function animate() {
  if (!inCall) { bars.forEach(b => { b.style.height = ''; }); document.body.classList.remove('talking'); return; }
  const lvl = clipPlaying ? 0.03 + 0.03 * Math.abs(Math.sin(Date.now() / 160))
            : claudeState === 'speaking' ? levelOf(remoteLevel) * 2.2 : (muted ? 0 : levelOf(micLevel) * 3);
  smooth = smooth * 0.6 + Math.min(lvl * 8, 1) * 0.4;
  if (claudeState !== 'thinking') bars.forEach((b, i) => { b.style.height = (6 + smooth * 30 * shape[i] * (0.8 + Math.random() * 0.4)) + 'px'; });
  document.body.classList.toggle('talking', smooth > 0.08);
  $('avatar').style.setProperty('--ring', 1 + smooth * 0.22);
  requestAnimationFrame(animate);
}

// the phone streams its microphone like any call app; the PC decides when Harsh has finished and when he cuts in
async function call() {
  setState('connecting'); hint.textContent = '';
  actx = new AudioContext();
  if (stt !== 'google') {   // laptop mode: stream the microphone; Google mode: one mic user at a time, so none here
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    } catch (e) { hint.textContent = 'Microphone blocked: allow it for this page.'; setState('ready'); wantCall = false; return; }
    stream.getAudioTracks().forEach(t => { t.enabled = !muted; });
    micLevel = actx.createAnalyser(); micLevel.fftSize = 1024;
    actx.createMediaStreamSource(stream).connect(micLevel);
  }
  try { wake = await navigator.wakeLock?.request('screen'); } catch (e) {}
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: 'Call with Claude', artist: 'Claude', artwork: [{ src: 'icon.svg', sizes: 'any', type: 'image/svg+xml' }] });
  }
  peer = new Peer({ debug: 1 });
  peer.on('error', e => {
    if (redialing) { hangup(false, true); return; }
    hint.textContent = 'Could not reach the PC (' + e.type + '). Is it on?'; hangup(false);
  });
  peer.on('call', c => {
    if (stream) c.answer(stream); else c.answer();   // Google mode: Claude's voice comes in, Harsh's words go as text
    c.on('stream', s => {
      remote.srcObject = s; remote.play().then(() => dbg('voice playing')).catch(e => dbg('voice blocked ' + e.name));
      try { remoteLevel = actx.createAnalyser(); remoteLevel.fftSize = 1024; actx.createMediaStreamSource(s).connect(remoteLevel); } catch (e) {}
    });
  });
  peer.on('open', () => {
    conn = peer.connect(PEER, { reliable: true });
    conn.on('open', () => {
      conn.send({ t: 'hello', key: KEY, test: h.get('autocall') === '1', stt, redial: !!redialing, clips: false });
      if (!callStart) callStart = Date.now();
      inCall = true; showCallControls(true); setState('idle');
      hint.textContent = stt === 'google' ? 'Tap the screen to cut Claude off.' : ''; animate();
      setTimeout(() => { if (hint.textContent.startsWith('Tap the screen')) hint.textContent = ''; }, 6000);
      if (!muted && !clipPlaying) startRec();
    });
    conn.on('data', m => {
      if (m.t === 'audio' && m.data) onClip(m);
      else if (m.t === 'line') { line(m.who, m.text); if (m.who === 'claude') { recentClaude.push(m.text); recentClaude = recentClaude.slice(-6); } }
      else if (m.t === 'state') {
        if (clipPlaying && (m.s === 'speaking' || m.s === 'idle')) return;   // clip mode only (off by default)
        if (claudeState === 'speaking' && m.s !== 'speaking') speakingUntil = Date.now() + 1200;
        setState(m.s);
      }
    });
    conn.on('close', () => dropped());
  });
  peer.on('disconnected', () => dropped());
  setTimeout(() => { if (!inCall && peer && !redialing) { hint.textContent = 'The PC did not answer. Is it on?'; hangup(false); } }, 20000);
}

// the line dropped but he did not press End: call back by itself for two minutes, and when the screen comes back on
let wantCall = false, redialing = null;
function dropped() {
  if (!wantCall || redialing) return;
  hangup(false, true);
  setState('dropped');
  let tries = 0;
  redialing = setInterval(() => {
    if (!wantCall || inCall || ++tries > 40) {
      clearInterval(redialing); redialing = null;
      if (!inCall && wantCall) { hint.textContent = 'Could not call back. Tap Talk.'; wantCall = false; callStart = 0; setState('ready'); }
      return;
    }
    if (!peer && !document.hidden) call();
  }, 3000);
}
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) return;
  if (inCall) { try { wake = await navigator.wakeLock?.request('screen'); } catch (e) {} if (!muted) startRec(); }
  if (wantCall && !inCall && !peer) call();
});

function hangup(tell = true, keepWanting = false) {
  if (!keepWanting) { wantCall = false; if (redialing) { clearInterval(redialing); redialing = null; } }
  if (tell && conn && conn.open) { try { conn.send({ t: 'bye' }); } catch (e) {} }
  inCall = false; stopRec(); clips = []; clipPlaying = false; try { clipEl.pause(); } catch (e) {}
  setTimeout(() => { try { peer && peer.destroy(); } catch (e) {} peer = null; conn = null; }, 300);
  try { stream && stream.getTracks().forEach(t => t.stop()); } catch (e) {}
  try { actx && actx.close(); } catch (e) {}
  try { wake && wake.release(); } catch (e) {}
  remote.srcObject = null; micLevel = remoteLevel = null;
  if (!keepWanting) {
    showCallControls(false); callStart = 0; setState('ready');
    caption.className = ''; caption.textContent = 'Call ended.';
  }
}

$('call').onclick = () => {   // a new call starts clean: no transcript from earlier calls
  wantCall = true; muted = false; updateMute();
  log.innerHTML = '<div class="empty">Nothing said yet.</div>'; caption.className = ''; caption.textContent = '';
  call();
};
$('end').onclick = () => hangup(true);
function updateMute() {
  $('mute').classList.toggle('on', muted);
  $('muteLabel').textContent = muted ? 'Unmute' : 'Mute';
  if (stream) stream.getAudioTracks().forEach(t => { t.enabled = !muted; });
  if (inCall) { if (muted) stopRec(); else startRec(); setState(claudeState); }
}
$('mute').onclick = () => { muted = !muted; updateMute(); };
$('kb').onclick = () => $('typed').focus();
$('history').onclick = () => $('sheet').classList.remove('hidden');
$('sheet').onclick = e => { if (e.target.id === 'sheet') $('sheet').classList.add('hidden'); };
function sendTyped(input) {   // same route as speech, skipping speech-to-text; approvals stay the same in every mode
  const text = input.value.trim();
  if (!text) return;
  if (!conn || !conn.open) { hint.textContent = 'Not on a call: tap Talk first.'; return; }
  conn.send({ t: 'type', text, desk: $('desk').value, mode: $('mode').value });
  input.value = '';
}
$('typeBar').onsubmit = e => { e.preventDefault(); sendTyped($('typed')); };
$('sheetType').onsubmit = e => { e.preventDefault(); sendTyped($('typed2')); };
for (const id of ['desk', 'mode']) {
  try { const v = localStorage.getItem('call_' + id); if (v) $(id).value = v; } catch (e) {}
  $(id).onchange = () => { try { localStorage.setItem('call_' + id, $(id).value); } catch (e) {} };
}

// ---------------------------------------------------------------- Google speech recognition on the phone
// Chrome on Android has Google's own recognizer (the one behind Gboard's mic): free and good with Indian English. When it
// is on, the phone sends what Harsh said as text and no microphone audio, so the laptop's Whisper is not used at all.
const GSR = window.SpeechRecognition || window.webkitSpeechRecognition;
let stt = 'google'; try { stt = localStorage.getItem('call_stt') || 'google'; } catch (e) {}
if (!GSR || h.get('autocall') === '1') stt = 'laptop';   // the PC's own test plays a recording into a fake microphone
$('stt').value = stt;
$('stt').onchange = () => { stt = $('stt').value; try { localStorage.setItem('call_stt', stt); } catch (e) {} hint.textContent = 'Takes effect on the next call.'; };
let rec = null, recOn = false, recentClaude = [];
var clipPlaying = false;
const words = t => t.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(Boolean);
let speakingUntil = 0, lastFinal = '', lastFinalAt = 0, settling = '', settleTimer = null;
function isEcho(text) {   // the phone's speaker can be heard by its own mic: ignore Claude's own recent words
  const w = words(text); if (!w.length) return true;
  const pool = new Set(words(recentClaude.slice(-3).join(' ')));
  const share = w.filter(x => pool.has(x)).length / w.length;
  if (w.length <= 2) return share > 0;   // "sorry", "go on": one or two words Claude just said
  // while Claude talks (and a second after), only clearly new words count as Harsh
  return share >= (claudeState === 'speaking' || Date.now() < speakingUntil ? 0.4 : 0.7);
}
function isRepeat(text) {   // Android sometimes delivers the same final result twice
  const same = text.toLowerCase() === lastFinal && Date.now() - lastFinalAt < 4000;
  lastFinal = text.toLowerCase(); lastFinalAt = Date.now();
  return same;
}
function dbg(text) { try { if (conn && conn.open) conn.send({ t: 'dbg', text }); } catch (e) {} }
function startRec() {
  if (!GSR || stt !== 'google' || clipPlaying) return;
  if (!rec) {
    rec = new GSR(); rec.lang = 'en-IN'; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 1;
    // Android marks every growing piece of a sentence as final ("I", "I have", "I have told"), so the flag is not
    // trusted: the latest text is shown as it grows and sent once it has not changed for 1.2 s.
    rec.onresult = e => {
      const r = e.results[e.results.length - 1], text = r[0].transcript.trim();
      if (!text || isEcho(text)) return;
      caption.textContent = text; caption.className = 'me';
      if (claudeState === 'speaking' && words(text).length >= 2) { if (conn && conn.open) conn.send({ t: 'interrupt' }); claudeState = 'idle'; dbg('cut in: ' + text.slice(0, 40)); }
      settling = text;
      clearTimeout(settleTimer);
      settleTimer = setTimeout(() => {
        const t = settling; settling = '';
        if (t && !isEcho(t) && !isRepeat(t) && conn && conn.open) conn.send({ t: 'said', text: t });
      }, 1200);
    };
    rec.onend = () => { recOn = false; if (inCall && !muted && stt === 'google' && !document.hidden && !clipPlaying) setTimeout(startRec, 250); };
    rec.onerror = e => { dbg('speech error ' + e.error); if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { hint.textContent = 'Google speech not allowed here: switch to the laptop in the sidebar.'; } };
  }
  if (!recOn) { try { rec.start(); recOn = true; } catch (e) {} }
}
function stopRec() { try { rec && rec.abort(); } catch (e) {} recOn = false; }

// ---------------------------------------------------------------- Claude's voice as clips (Google mode)
// No live audio call in Google mode: Android keeps the mic in its normal, best mode (as when typing with the keyboard's
// mic). Google stops listening while a clip plays, so it never hears Claude, and starts again right after.
const clipEl = $('clip');
let clips = [];
function onClip(m) {
  clips.push(URL.createObjectURL(new Blob([m.data], { type: 'audio/wav' })));
  if (!clipPlaying) nextClip();
}
function nextClip() {
  if (!clips.length) {
    clipPlaying = false; setState('idle'); speakingUntil = Date.now() + 600;
    if (inCall && !muted) setTimeout(startRec, 300);
    return;
  }
  clipPlaying = true; stopRec(); setState('speaking');
  const url = clips.shift();
  clipEl.src = url;
  let done = false;
  const finish = () => { if (done) return; done = true; clearTimeout(guard); URL.revokeObjectURL(url); nextClip(); };
  const guard = setTimeout(finish, 20000);   // a clip that never ends must not stop the listening for good
  clipEl.onended = finish; clipEl.onerror = finish;
  clipEl.play().catch(finish);
}
function cutIn() {   // tap while Claude talks: stop it and listen
  if (!clipPlaying) return;
  clips.forEach(u => URL.revokeObjectURL(u)); clips = [];
  clipEl.pause(); clipPlaying = false;
  if (conn && conn.open) conn.send({ t: 'interrupt' });
  setState('idle'); if (!muted) startRec();
}
$('v-call').addEventListener('click', e => { if (!e.target.closest('button, input, select, form')) cutIn(); });

// ---------------------------------------------------------------- sidebar: Harsh's mods, read from the PC
let side = null, sideConn = null, sideReady = null;
const titles = { call: 'Claude', brain: 'Brain', approvals: 'Approvals', desks: 'Desks', mis: 'MIS', connectors: 'Connectors' };
function openDrawer(on) { $('drawer').classList.toggle('open', on); $('scrim').classList.toggle('hidden', !on); }
$('menu').onclick = () => openDrawer(true);
$('scrim').onclick = () => openDrawer(false);
$('onCallChip').onclick = () => show('call');
document.querySelectorAll('.nav').forEach(b => b.onclick = () => { openDrawer(false); show(b.dataset.view); });

function show(view) {
  currentView = view;
  document.querySelectorAll('.nav').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  $('barTitle').textContent = titles[view];
  $('v-call').classList.toggle('hidden', view !== 'call');
  $('v-panel').classList.toggle('hidden', view === 'call');
  $('onCallChip').classList.toggle('hidden', !inCall || view === 'call');
  if (view !== 'call') loadPanel(view);
}

// its own quiet link to the PC, so the sidebar works without a call
function sideLink() {
  if (sideConn && sideConn.open) return Promise.resolve(sideConn);
  if (sideReady) return sideReady;
  sideReady = new Promise((resolve, reject) => {
    side = new Peer({ debug: 1 });
    const fail = () => { sideReady = null; try { side.destroy(); } catch (e) {} side = sideConn = null; reject(new Error('PC not reachable')); };
    const timer = setTimeout(fail, 15000);
    side.on('error', fail);
    side.on('open', () => {
      sideConn = side.connect(PEER, { reliable: true });
      sideConn.on('open', () => { sideConn.send({ t: 'hello', key: KEY, panel: true }); clearTimeout(timer); sideReady = null; resolve(sideConn); });
      sideConn.on('data', onPanelData);
      sideConn.on('close', () => { sideConn = null; });
    });
  });
  return sideReady;
}
async function ask(msg) { (await sideLink()).send(msg); }

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function section(title, items, render) {
  const s = el('div', 'section'); s.appendChild(el('h3', '', title));
  items.forEach(x => s.appendChild(render(x)));
  return s;
}
const textCard = t => el('div', 'card', t);

async function loadPanel(view) {
  const body = $('panelBody');
  body.innerHTML = ''; body.appendChild(el('div', 'empty', 'Loading...'));
  try { await ask({ t: 'panel', what: view }); }
  catch (e) { body.innerHTML = ''; body.appendChild(el('div', 'empty', 'Could not reach the PC. Is it on?')); }
}

function onPanelData(m) {
  if (m.t === 'answered') { if (currentView === 'approvals') loadPanel('approvals'); return; }
  if (m.t !== 'panel' || m.what !== currentView) return;
  const body = $('panelBody'), d = m.data;
  body.innerHTML = '';
  if (d == null) { body.appendChild(el('div', 'empty', 'Nothing to show.')); return; }
  if (m.what === 'brain') {
    const n = (d.groups || []).find(g => g.label === 'Overdue');
    $('b-brain').textContent = n ? n.items.length + ' overdue' : '';
    if (d.meetings && d.meetings.length) body.appendChild(section('Meetings', d.meetings, textCard));
    (d.groups || []).forEach(g => body.appendChild(section(`${g.label} (${g.items.length})`, g.items, textCard)));
    if (d.todo && d.todo.length) body.appendChild(section(`To do today (${d.todo.length})`, d.todo, textCard));
    if (d.done && d.done.length) body.appendChild(section('Done today', d.done, textCard));
    body.appendChild(el('div', 'refresh', 'Brain as of ' + (d.updated || 'now')));
  } else if (m.what === 'approvals') {
    $('b-approvals').textContent = d.length ? String(d.length) : '';
    if (!d.length) { body.appendChild(el('div', 'empty', 'No desk is waiting for your yes.')); return; }
    body.appendChild(section('Waiting for your answer', d, a => {
      const c = el('div', 'card');
      c.appendChild(el('div', '', a.text));
      c.appendChild(el('div', 'sub', `${a.desk} desk · ${a.at}`));
      const btns = el('div', 'btns');
      for (const [label, word, cls] of [['No', 'no', ''], ['Yes', 'yes', 'yes']]) {
        const b = el('button', cls, label);
        b.onclick = () => { b.disabled = true; ask({ t: 'answer', desk: a.desk, text: word }); };
        btns.appendChild(b);
      }
      c.appendChild(btns);
      return c;
    }));
    body.appendChild(el('div', 'refresh', 'Changes to live systems still need Approve at the laptop.'));
  } else if (m.what === 'desks') {
    const colour = s => s === 'working' ? 'var(--primary)' : s === 'waiting for you' ? 'var(--warn)' : s === 'closed' ? 'var(--line)' : 'var(--good)';
    body.appendChild(section('Desks', d, r => {
      const c = el('div', 'card'), row = el('div', 'row'), left = el('div', '');
      left.appendChild(el('div', '', r.title));
      left.appendChild(el('div', 'sub', r.state + (r.held ? ' · holds a live change' : '') + (r.last ? ' · ' + r.last : '')));
      const dot = el('span', 'dot'); dot.style.background = colour(r.state);
      row.appendChild(left); row.appendChild(dot); c.appendChild(row); return c;
    }));
  } else if (m.what === 'mis') {
    body.appendChild(section('Today’s MIS', d.length ? d : ['No status yet.'], textCard));
  } else if (m.what === 'connectors') {
    body.appendChild(section('Live feeds', d, f => {
      const c = el('div', 'card'), row = el('div', 'row');
      const ok = f.age != null && f.age <= 10;
      row.appendChild(el('span', '', f.name));
      const wrap = el('div', 'row');
      wrap.appendChild(el('span', 'sub', f.age == null ? 'down' : ok ? 'working' : `quiet ${f.age} min`));
      const dot = el('span', 'dot'); dot.style.background = ok ? 'var(--good)' : 'var(--endbg)';
      wrap.appendChild(dot); row.appendChild(wrap); c.appendChild(row); return c;
    }));
  }
}

// ---------------------------------------------------------------- reload and updates
// The reload button loads the latest version. The app also checks for a newer version every two minutes and, when one
// is published, shows "Update ready"; it never reloads by itself, and never during a call.
function reloadApp() {
  if (inCall && !confirm('Reloading ends the call. Reload now?')) return;
  if (inCall) hangup(true);
  location.replace(location.pathname + '?u=' + Date.now());
}
$('reload').onclick = reloadApp;
$('updateChip').onclick = reloadApp;
let firstCopy = null;
async function checkUpdate() {
  try {
    const t = await (await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' })).text();
    if (firstCopy === null) { firstCopy = t; return; }
    $('updateChip').classList.toggle('hidden', t === firstCopy);
  } catch (e) {}
}
checkUpdate(); setInterval(checkUpdate, 120000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });

if (h.get('autocall') === '1') { wantCall = true; call(); }   // only for the PC's own test (test_call.py); a phone never has it in its link
</script>
</body>
</html>
